<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇮🇸 License plate lookup · Iceland</title>
  <style>
    /* barebones – reset, minimal, clean */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    .card {
      background: white;
      max-width: 720px;
      width: 100%;
      padding: 2rem 2rem 2.2rem;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.1s ease;
    }

    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.01em;
      color: #0b1a33;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .subhead {
      color: #4a5b6e;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid #e6edf4;
      padding-bottom: 0.9rem;
    }

    .lookup-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .lookup-form label {
      font-weight: 500;
      color: #1f2a3f;
      font-size: 0.95rem;
    }

    .lookup-form input {
      flex: 2 1 200px;
      padding: 0.7rem 1rem;
      border: 1px solid #d0d9e5;
      border-radius: 60px;
      font-size: 1rem;
      background: #fafcff;
      transition: 0.15s;
      outline: none;
      text-transform: lowercase;
    }

    .lookup-form input:focus {
      border-color: #2a6b9e;
      box-shadow: 0 0 0 3px rgba(42, 107, 158, 0.15);
      background: white;
    }

    .lookup-form button {
      background: #1e3b5c;
      border: none;
      color: white;
      font-weight: 500;
      padding: 0.7rem 1.6rem;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .lookup-form button:hover {
      background: #143049;
    }

    .lookup-form button:active {
      transform: scale(0.97);
    }

    /* result panel */
    .result-box {
      background: #f0f4fa;
      border-radius: 20px;
      padding: 1.6rem 1.8rem;
      margin-top: 0.5rem;
      transition: 0.2s;
      border: 1px solid #e2eaf3;
    }

    .result-empty {
      color: #4a5b6e;
      font-size: 0.95rem;
      opacity: 0.7;
      text-align: center;
      padding: 1.2rem 0;
    }

    .result-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #dde5ef;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-weight: 500;
      color: #1e3249;
      letter-spacing: 0.2px;
    }

    .result-value {
      color: #0b1a2e;
      font-weight: 450;
      word-break: break-word;
      text-align: right;
      max-width: 70%;
    }

    .vehicle-title {
      font-size: 1.3rem;
      font-weight: 550;
      color: #0b1a33;
      margin-bottom: 0.25rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #cbd8e8;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .vehicle-title small {
      font-weight: 400;
      font-size: 0.8rem;
      color: #2f4b6e;
      background: #dce6f2;
      padding: 0.15rem 0.7rem;
      border-radius: 30px;
    }

    .meta-note {
      font-size: 0.8rem;
      color: #4d6a8c;
      margin-top: 1rem;
      border-top: 1px dashed #cdd9e9;
      padding-top: 0.8rem;
    }

    .meta-note span {
      display: inline-block;
      margin-right: 0.8rem;
    }

    .error-message {
      color: #b13e3e;
      background: #ffe8e8;
      padding: 0.6rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      border: 1px solid #f5c2c2;
    }

    .plate-badge {
      background: #f5f9ff;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      border: 1px solid #b8cee5;
      font-family: monospace;
      font-weight: 500;
    }

    .color-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
      vertical-align: middle;
      margin-right: 6px;
    }

    .rental-badge {
      display: inline-block;
      background: #e2edf7;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #1a3c5e;
      margin-left: 0.5rem;
      border: 1px solid #b8cee5;
    }

    .rental-badge.rental {
      background: #fce8e8;
      color: #a03131;
      border-color: #e6bdbd;
    }

    .rental-badge.not-rental {
      background: #e5f0e5;
      color: #1e6b3b;
      border-color: #b6d7b6;
    }

    /* small screen */
    @media (max-width: 480px) {
      .card { padding: 1.5rem; }
      .lookup-form button { width: 100%; }
      .result-item { flex-direction: column; align-items: flex-start; gap: 0.2rem; }
      .result-value { text-align: left; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <span>🔍</span> Íslensk skráning
    </h1>
    <div class="subhead">
      Sláðu inn skráningarnúmer (t.d. <span class="plate-badge">OY B68</span>)
    </div>

    <form class="lookup-form" id="lookupForm">
      <label for="plateInput">Númer:</label>
      <input type="text" id="plateInput" placeholder="t.d. OY B68" spellcheck="false">
      <button type="submit">Sækja gögn</button>
    </form>

    <div id="resultContainer" class="result-box">
      <div class="result-empty">⏳ sláðu inn númer og ýttu á „Sækja gögn“</div>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('lookupForm');
      const plateInput = document.getElementById('plateInput');
      const resultContainer = document.getElementById('resultContainer');

      // normalize license plate: trim, lower case, remove spaces
      function normalizePlate(raw) {
        return raw.trim().toLowerCase().replace(/\s+/g, '');
      }

      // translate Icelandic import status to Yes/No and also detect if it's a "new" (non-import) vehicle
      function translateImportStatus(raw) {
        if (!raw) return { display: '—', isImported: false };
        const lower = raw.toLowerCase().trim();
        if (lower.includes('notað')) {
          return { display: 'Yes', isImported: true };
        }
        if (lower.includes('nýtt')) {
          return { display: 'No', isImported: false };
        }
        return { display: raw, isImported: false };
      }

      // get a readable color name or return the raw value
      function formatColor(raw) {
        if (!raw || raw === '—') return '—';
        return raw;
      }

      // ----- rental detection from usegroup -----
      function getRentalInfo(usegroup) {
        if (!usegroup) return { isRental: false, display: '—' };
        const lower = usegroup.toLowerCase().trim();
        // "Ökutækjaleiga" -> rental
        if (lower.includes('ökutækjaleiga') || lower.includes('leiga')) {
          return { isRental: true, display: 'Rental' };
        }
        // "Almenn notkun" -> not rental
        if (lower.includes('almenn notkun') || lower.includes('almenn')) {
          return { isRental: false, display: 'Private' };
        }
        // fallback: show raw but treat as not rental
        return { isRental: false, display: usegroup };
      }

      // render vehicle data from API response
      function renderData(data) {
        if (!data || !data.data) {
          resultContainer.innerHTML = `<div class="error-message">⚠️ Ótæk gögn (vantar 'data')</div>`;
          return;
        }

        const d = data.data;
        const make = d.make || '—';
        const vehcom = d.vehcom || '—';
        const speccom = d.speccom || '—';
        const preregdate = d.preregdate || '—';
        const firstregdate = d.firstregdate || '—';
        const rawImport = d.import || '—';
        const importInfo = translateImportStatus(rawImport);
        const importDisplay = importInfo.display;
        const isImported = importInfo.isImported;
        const vin = d.vin || '—';
        const carTitle = d.car_title || `${make} ${vehcom}`.trim() || 'FORD F150 TREMOR';

        // NEW FIELDS
        const color = d.color || '—';
        const regtype = d.regtype || '—';
        const formercountry = d.formercountry || '—';
        const importername = d.importername || '—';
        const usegroup = d.usegroup || '—';

        // rental info
        const rental = getRentalInfo(usegroup);
        const isRental = rental.isRental;
        const rentalDisplay = rental.display;

        // build clean display
        let html = '';

        // primary: make + vehcom + speccom + rental badge
        const rentalBadgeClass = isRental ? 'rental' : 'not-rental';
        const rentalBadgeText = isRental ? '🚗 Rental' : 'Private';
        html += `<div class="vehicle-title">
          <span>${make} ${vehcom} ${speccom}</span>
          <small>${importDisplay} <span class="rental-badge ${rentalBadgeClass}">${rentalBadgeText}</span></small>
        </div>`;

        const fields = [];

        // ---- Registration dates: switch for imported cars ----
        // For imported: show "First registration (original)" first, then "First registration in Iceland"
        if (isImported) {
          // original first registration
          if (firstregdate && firstregdate !== '—') {
            fields.push({ label: 'First registration (original)', value: firstregdate });
          }
          // Iceland registration (preregdate)
          if (preregdate && preregdate !== '—') {
            fields.push({ label: 'First registration in Iceland', value: preregdate });
          }
          // if both are missing, fallback
          if ((!firstregdate || firstregdate === '—') && (!preregdate || preregdate === '—')) {
            fields.push({ label: 'First registration', value: '—' });
          }
        } else {
          // non-imported: show preregdate (or firstregdate as fallback)
          if (preregdate && preregdate !== '—') {
            fields.push({ label: 'First registration', value: preregdate });
          } else if (firstregdate && firstregdate !== '—') {
            fields.push({ label: 'First registration', value: firstregdate });
          } else {
            fields.push({ label: 'First registration', value: '—' });
          }
        }

        // Color - with a color dot if we have a color name
        if (color && color !== '—') {
          const colorLower = color.toLowerCase();
          const colorHex = getColorHex(colorLower);
          const colorDisplay = colorHex 
            ? `<span class="color-dot" style="background-color:${colorHex};"></span> ${color}`
            : color;
          fields.push({ label: 'Color', value: colorDisplay });
        } else {
          fields.push({ label: 'Color', value: '—' });
        }

        // Registration type
        if (regtype && regtype !== '—') {
          fields.push({ label: 'Registration type', value: regtype });
        }

        // Importer name
        if (importername && importername !== '—') {
          fields.push({ label: 'Importer', value: importername });
        }

        // Former country
        if (formercountry && formercountry !== '—') {
          fields.push({ label: 'Former country', value: formercountry });
        }

        // always add Imported, VIN
        fields.push({ label: 'Imported', value: importDisplay });
        if (vin && vin !== '—') {
          fields.push({ label: 'VIN', value: vin });
        }

        // ---- Rental status as separate field (already in title, but also show explicitly) ----
        fields.push({ label: 'Use group', value: usegroup !== '—' ? usegroup : '—' });

        for (const f of fields) {
          html += `<div class="result-item">
            <span class="result-label">${f.label}</span>
            <span class="result-value">${f.value}</span>
          </div>`;
        }

        // optional extra: show plate
        const plateDisplay = d.car_number || (data.car_number) || '—';
        if (plateDisplay && plateDisplay !== '—') {
          html += `<div class="result-item" style="border-top:1px dashed #ccd9e8; margin-top:0.3rem; padding-top:0.6rem;">
            <span class="result-label">🔖 Skráning</span>
            <span class="result-value" style="font-family: monospace;">${plateDisplay}</span>
          </div>`;
        }

        // hidden extra: if car_title exists and is different from make+vehcom
        if (carTitle && carTitle !== `${make} ${vehcom}`.trim() && carTitle !== `${make} ${vehcom} ${speccom}`.trim()) {
          html += `<div class="result-item" style="opacity:0.7; font-size:0.9rem;">
            <span class="result-label">Tegund</span>
            <span class="result-value">${carTitle}</span>
          </div>`;
        }

        // meta: country info
        if (d.country) {
          html += `<div class="meta-note">
            <span>🌍 ${d.country}</span>
            ${d.formercountry ? `<span>· fyrr: ${d.formercountry}</span>` : ''}
            ${d.importername ? `<span>· innflytjandi: ${d.importername}</span>` : ''}
          </div>`;
        }

        resultContainer.innerHTML = html;
      }

      // Helper: map color names to hex values for the color dot
      function getColorHex(colorName) {
        const colorMap = {
          'black': '#1a1a1a',
          'white': '#f0f0f0',
          'red': '#cc0000',
          'blue': '#0044cc',
          'green': '#008800',
          'yellow': '#cccc00',
          'orange': '#ff8800',
          'purple': '#8800cc',
          'pink': '#ff66b2',
          'brown': '#8b4513',
          'grey': '#808080',
          'gray': '#808080',
          'silver': '#c0c0c0',
          'gold': '#ffd700',
          'beige': '#f5f5dc',
          'maroon': '#800000',
          'navy': '#000080',
          'teal': '#008080',
          'olive': '#808000',
          'lime': '#00ff00',
          'cyan': '#00cccc',
          'magenta': '#cc00cc',
          'coral': '#ff7f50',
          'tan': '#d2b48c',
          'ivory': '#fffff0',
          'champagne': '#f7e7ce',
          'bronze': '#cd7f32',
          'copper': '#b87333',
          'cream': '#fffdd0',
          'rust': '#8b3a1a',
          'burgundy': '#800020',
          'charcoal': '#36454f',
          'slate': '#708090',
          'mint': '#98ff98',
          'forest': '#228b22',
        };
        for (const [key, hex] of Object.entries(colorMap)) {
          if (colorName.includes(key)) {
            return hex;
          }
        }
        return null;
      }

      // handle errors / empty responses
      function showError(message) {
        resultContainer.innerHTML = `<div class="error-message">❌ ${message}</div>`;
      }

      // fetch data from API
      async function lookupPlate(plate, options) {
        const opts = options || {};
        const normalized = normalizePlate(plate);
        if (!normalized) {
          showError('Sláðu inn gilt skráningarnúmer.');
          return;
        }

        if (opts.updateUrl) {
          updateUrlWithPlate(normalized);
        }

        resultContainer.innerHTML = `<div style="color:#2f4b6e;">⏳ sæki gögn fyrir <strong>${normalized}</strong> ...</div>`;

        const url = `https://www.autoparts.is/api/car-data/${normalized}`;

        try {
          const response = await fetch(url, {
            method: 'GET',
            headers: {
              'Accept': 'application/json',
            },
          });

          if (!response.ok) {
            if (response.status === 404) {
              showError(`Númer ${normalized} fannst ekki (404)`);
            } else {
              showError(`Villa í svari (${response.status})`);
            }
            return;
          }

          const json = await response.json();

          if (!json || !json.data) {
            showError('Engin gögn fyrir þetta númer.');
            return;
          }

          renderData(json);

        } catch (err) {
          console.warn('Fetch error:', err);
          showError('Gat ekki sótt gögn. Athugaðu tengingu eða reyndu aftur.');
        }
      }

      // form submit handler
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const raw = plateInput.value;
        const plate = normalizePlate(raw);
        if (plate) {
          lookupPlate(plate, { updateUrl: true });
        } else {
          showError('Vinsamlegast sláðu inn skráningarnúmer.');
        }
      });

      // ---- URL-based lookup support ----
      function getPlateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = params.get('plate');
        if (fromQuery) return fromQuery;

        const segments = window.location.pathname
          .split('/')
          .filter(s => s && s.toLowerCase() !== 'index.html');
        if (segments.length > 0) {
          return decodeURIComponent(segments[segments.length - 1]);
        }
        return null;
      }

      function updateUrlWithPlate(plate) {
        const url = new URL(window.location.href);
        url.searchParams.set('plate', plate);
        window.history.replaceState({ plate }, '', url);
      }

      // on load: if a plate is present in the URL, prefill the input and look it up
      (function initFromUrl() {
        const plateFromUrl = getPlateFromUrl();
        if (plateFromUrl) {
          const normalized = normalizePlate(plateFromUrl);
          plateInput.value = normalized;
          lookupPlate(normalized, { updateUrl: false });
        }
      })();
    })();
  </script>
</body>
</html>
