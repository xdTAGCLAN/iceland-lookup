<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇮🇸 License plate lookup · Iceland</title>
  <style>
    /* barebones – reset, minimal, clean */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    .card {
      background: white;
      max-width: 720px;
      width: 100%;
      padding: 2rem 2rem 2.2rem;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.1s ease;
    }

    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.01em;
      color: #0b1a33;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .subhead {
      color: #4a5b6e;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid #e6edf4;
      padding-bottom: 0.9rem;
    }

    .lookup-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .lookup-form label {
      font-weight: 500;
      color: #1f2a3f;
      font-size: 0.95rem;
    }

    .lookup-form input {
      flex: 2 1 200px;
      padding: 0.7rem 1rem;
      border: 1px solid #d0d9e5;
      border-radius: 60px;
      font-size: 1rem;
      background: #fafcff;
      transition: 0.15s;
      outline: none;
      text-transform: lowercase;
    }

    .lookup-form input:focus {
      border-color: #2a6b9e;
      box-shadow: 0 0 0 3px rgba(42, 107, 158, 0.15);
      background: white;
    }

    .lookup-form button {
      background: #1e3b5c;
      border: none;
      color: white;
      font-weight: 500;
      padding: 0.7rem 1.6rem;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .lookup-form button:hover {
      background: #143049;
    }

    .lookup-form button:active {
      transform: scale(0.97);
    }

    /* result panel */
    .result-box {
      background: #f0f4fa;
      border-radius: 20px;
      padding: 1.6rem 1.8rem;
      margin-top: 0.5rem;
      transition: 0.2s;
      border: 1px solid #e2eaf3;
    }

    .result-empty {
      color: #4a5b6e;
      font-size: 0.95rem;
      opacity: 0.7;
      text-align: center;
      padding: 1.2rem 0;
    }

    .result-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #dde5ef;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-weight: 500;
      color: #1e3249;
      letter-spacing: 0.2px;
    }

    .result-value {
      color: #0b1a2e;
      font-weight: 450;
      word-break: break-word;
      text-align: right;
      max-width: 70%;
    }

    .vehicle-title {
      font-size: 1.3rem;
      font-weight: 550;
      color: #0b1a33;
      margin-bottom: 0.25rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #cbd8e8;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .vehicle-title small {
      font-weight: 400;
      font-size: 0.8rem;
      color: #2f4b6e;
      background: #dce6f2;
      padding: 0.15rem 0.7rem;
      border-radius: 30px;
    }

    .meta-note {
      font-size: 0.8rem;
      color: #4d6a8c;
      margin-top: 1rem;
      text-align: right;
      border-top: 1px dashed #cdd9e9;
      padding-top: 0.8rem;
    }

    .error-message {
      color: #b13e3e;
      background: #ffe8e8;
      padding: 0.6rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      border: 1px solid #f5c2c2;
    }

    .plate-badge {
      background: #f5f9ff;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      border: 1px solid #b8cee5;
      font-family: monospace;
      font-weight: 500;
    }

    /* small screen */
    @media (max-width: 480px) {
      .card { padding: 1.5rem; }
      .lookup-form button { width: 100%; }
      .result-item { flex-direction: column; align-items: flex-start; gap: 0.2rem; }
      .result-value { text-align: left; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <span>🔍</span> Íslensk skráning
    </h1>
    <div class="subhead">
      Sláðu inn skráningarnúmer (t.d. <span class="plate-badge">OY B68</span>)
    </div>

    <form class="lookup-form" id="lookupForm">
      <label for="plateInput">Númer:</label>
      <input type="text" id="plateInput" placeholder="t.d. OY B68" spellcheck="false">
      <button type="submit">Sækja gögn</button>
    </form>

    <div id="resultContainer" class="result-box">
      <div class="result-empty">⏳ sláðu inn númer og ýttu á „Sækja gögn“</div>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('lookupForm');
      const plateInput = document.getElementById('plateInput');
      const resultContainer = document.getElementById('resultContainer');

      // normalize license plate: trim, lower case, remove spaces
      function normalizePlate(raw) {
        return raw.trim().toLowerCase().replace(/\s+/g, '');
      }

      // translate Icelandic import status to Yes/No and also detect if it's a "new" (non-import) vehicle
      function translateImportStatus(raw) {
        if (!raw) return { display: '—', isImported: false };
        const lower = raw.toLowerCase().trim();
        // "Notað"  -> "Yes" (used / imported)
        if (lower.includes('notað')) {
          return { display: 'Yes', isImported: true };
        }
        // "Nýtt" or similar -> "No" (new, not imported used)
        if (lower.includes('nýtt')) {
          return { display: 'No', isImported: false };
        }
        // fallback: assume not imported if unknown
        return { display: raw, isImported: false };
      }

      // render vehicle data from API response
      function renderData(data) {
        if (!data || !data.data) {
          resultContainer.innerHTML = `<div class="error-message">⚠️ Ótæk gögn (vantar 'data')</div>`;
          return;
        }

        const d = data.data;
        const make = d.make || '—';
        const vehcom = d.vehcom || '—';
        const speccom = d.speccom || '—';
        const preregdate = d.preregdate || '—';
        const firstregdate = d.firstregdate || '—';
        // translate import field
        const rawImport = d.import || '—';
        const importInfo = translateImportStatus(rawImport);
        const importDisplay = importInfo.display;
        const isImported = importInfo.isImported;
        const vin = d.vin || '—';
        const carTitle = d.car_title || `${make} ${vehcom}`.trim() || 'FORD F150 TREMOR';

        // build clean display
        let html = '';

        // primary: make + vehcom + speccom
        html += `<div class="vehicle-title">
          <span>${make} ${vehcom} ${speccom}</span>
          <small>${importDisplay}</small>
        </div>`;

        // details in a list
        // 1. First registration (in Iceland) — always shown, label "First registration"
        // 2. First registration in Iceland (original) — only shown if imported === Yes
        const fields = [];

        // Always show "First registration" using preregdate (Iceland registration)
        if (preregdate && preregdate !== '—') {
          fields.push({ label: 'First registration in Iceland', value: preregdate });
        } else if (firstregdate && firstregdate !== '—') {
          // fallback if preregdate missing, use firstregdate but label as "First registration"
          fields.push({ label: 'First registration', value: firstregdate });
        }

        // If imported, show the original first registration date as well with label "Original first registration"
        if (isImported) {
          if (firstregdate && firstregdate !== '—' && firstregdate !== preregdate) {
            fields.push({ label: 'First registration', value: firstregdate });
          } else if (firstregdate && firstregdate !== '—') {
            // if same as preregdate or only firstregdate exists, show it with clear label
            fields.push({ label: 'First registration', value: firstregdate });
          }
        }

        // always add Imported, VIN
        fields.push({ label: 'Imported', value: importDisplay });
        if (vin && vin !== '—') {
          fields.push({ label: 'VIN', value: vin });
        }

        for (const f of fields) {
          html += `<div class="result-item">
            <span class="result-label">${f.label}</span>
            <span class="result-value">${f.value}</span>
          </div>`;
        }

        // optional extra: show plate & if "car_title" differs
        const plateDisplay = d.car_number || (data.car_number) || '—';
        if (plateDisplay && plateDisplay !== '—') {
          html += `<div class="result-item" style="border-top:1px dashed #ccd9e8; margin-top:0.3rem; padding-top:0.6rem;">
            <span class="result-label">🔖 Skráning</span>
            <span class="result-value" style="font-family: monospace;">${plateDisplay}</span>
          </div>`;
        }

        // hidden extra: if car_title exists and is different from make+vehcom
        if (carTitle && carTitle !== `${make} ${vehcom}`.trim() && carTitle !== `${make} ${vehcom} ${speccom}`.trim()) {
          html += `<div class="result-item" style="opacity:0.7; font-size:0.9rem;">
            <span class="result-label">Tegund</span>
            <span class="result-value">${carTitle}</span>
          </div>`;
        }

        // tiny meta: if 'country' exists
        if (d.country) {
          html += `<div class="meta-note">🌍 ${d.country} ${d.formercountry ? '· fyrr: '+d.formercountry : ''}</div>`;
        }

        resultContainer.innerHTML = html;
      }

      // handle errors / empty responses
      function showError(message) {
        resultContainer.innerHTML = `<div class="error-message">❌ ${message}</div>`;
      }

      // fetch data from API
      async function lookupPlate(plate, options) {
        const opts = options || {};
        const normalized = normalizePlate(plate);
        if (!normalized) {
          showError('Sláðu inn gilt skráningarnúmer.');
          return;
        }

        if (opts.updateUrl) {
          updateUrlWithPlate(normalized);
        }

        // show loading state
        resultContainer.innerHTML = `<div style="color:#2f4b6e;">⏳ sæki gögn fyrir <strong>${normalized}</strong> ...</div>`;

        const url = `https://www.autoparts.is/api/car-data/${normalized}`;

        try {
          const response = await fetch(url, {
            method: 'GET',
            headers: {
              'Accept': 'application/json',
            },
          });

          if (!response.ok) {
            if (response.status === 404) {
              showError(`Númer ${normalized} fannst ekki (404)`);
            } else {
              showError(`Villa í svari (${response.status})`);
            }
            return;
          }

          const json = await response.json();

          // check if we have data
          if (!json || !json.data) {
            showError('Engin gögn fyrir þetta númer.');
            return;
          }

          // success — render
          renderData(json);

        } catch (err) {
          console.warn('Fetch error:', err);
          showError('Gat ekki sótt gögn. Athugaðu tengingu eða reyndu aftur.');
        }
      }

      // form submit handler
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const raw = plateInput.value;
        const plate = normalizePlate(raw);
        if (plate) {
          lookupPlate(plate, { updateUrl: true });
        } else {
          showError('Vinsamlegast sláðu inn skráningarnúmer.');
        }
      });

      // ---- URL-based lookup support ----
      // Supports two styles:
      //   1. Query string (works on any static host, no server config needed):
      //        yoursite.com/?plate=AY123
      //   2. Path segment (requires the host to rewrite unknown paths back to
      //      this index.html, e.g. Netlify _redirects, Vercel rewrites, or
      //      GitHub Pages 404.html trick):
      //        yoursite.com/AY123

      // pull a plate out of the current URL, trying query string first, then path
      function getPlateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = params.get('plate');
        if (fromQuery) return fromQuery;

        // fallback: last non-empty path segment (ignore trailing slash / index.html)
        const segments = window.location.pathname
          .split('/')
          .filter(s => s && s.toLowerCase() !== 'index.html');
        if (segments.length > 0) {
          return decodeURIComponent(segments[segments.length - 1]);
        }
        return null;
      }

      // reflect the current plate in the URL without reloading the page,
      // so the page is bookmarkable / shareable. Always uses the query-string
      // form since that's guaranteed to work regardless of server config.
      function updateUrlWithPlate(plate) {
        const url = new URL(window.location.href);
        url.searchParams.set('plate', plate);
        window.history.replaceState({ plate }, '', url);
      }

      // on load: if a plate is present in the URL, prefill the input and look it up
      (function initFromUrl() {
        const plateFromUrl = getPlateFromUrl();
        if (plateFromUrl) {
          const normalized = normalizePlate(plateFromUrl);
          plateInput.value = normalized;
          lookupPlate(normalized, { updateUrl: false }); // already in URL, no need to rewrite it
        }
      })();
    })();
  </script>
</body>
</html>
